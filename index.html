<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Doodle Jump</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="game-container">

        <canvas id="game"></canvas>


        <!-- Кнопка рестарта -->

        <button
            id="restartButton"
            class="restart-button"
        >
            ИГРАТЬ СНОВА
        </button>


        <!-- Управление -->

        <div class="controls">

            <button id="leftButton">
                ◀
            </button>

            <button id="rightButton">
                ▶
            </button>

        </div>

    </div>


    <script src="game.js?v=4"></script>

</body>

</html>
